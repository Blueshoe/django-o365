name: Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
        django-version: ['5.0', '5.2']
        exclude:
          # Django 5.0 supports Python up to 3.12
          - python-version: '3.13'
            django-version: '5.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run black (check only)
        run: black --check .

      - name: Run flake8
        run: flake8 .

      - name: Run tests
        run: pytest -W error tests/
