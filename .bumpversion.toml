[tool.bumpversion]
current_version = "0.5.0"
commit = true
tag = true
tag_name = "{new_version}"

# Run `uv lock` before the commit is generated
pre_commit_hooks = [
    "uv lock",
    "git add -- uv.lock",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'