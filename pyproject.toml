[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-o365"
version = "0.3.1"
description = "EmailBackend for Django to work with Microsoft Exchange Online, via o365 package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Gutschale", email = "r.gutschale@blueshoe.de" },
]
keywords = ["django", "Outlook", "Microsoft", "Exchange", "Blueshoe", "O365"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django~=5.2.18",
    "o365~=2.1.10",
]

[project.urls]
Homepage = "https://github.com/Blueshoe/django-o365"
Repository = "https://github.com/Blueshoe/django-o365"

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "pytest>=9.0.2",
    "pytest-html>=4.1.1",
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]

[tool.setuptools]
packages = ["django_o365"]
include-package-data = true
